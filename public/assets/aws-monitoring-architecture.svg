<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#090b10; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1040" height="55" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <circle cx="55" cy="52" r="6" fill="#ef4444"/>
  <circle cx="75" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="52" r="6" fill="#10b981"/>
  <text x="125" y="58" fill="#facc15" font-size="16" font-weight="bold">OBSERVABILITY ARCHITECTURE: Prometheus, Grafana, Alertmanager &amp; AWS SNS</text>
  <text x="890" y="57" fill="#64748b" font-size="12">FULL-STACK TELEMETRY</text>

  <!-- Container Box -->
  <rect x="30" y="95" width="1040" height="495" rx="16" fill="#0c0e14" stroke="#1e2638" stroke-width="1.5"/>

  <!-- Tier 1: Target Hosts -->
  <rect x="60" y="130" width="220" height="425" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <text x="80" y="165" fill="#facc15" font-size="13" font-weight="bold">1. TARGET SERVERS (AWS EC2)</text>

  <rect x="75" y="195" width="190" height="150" rx="8" fill="#080a0f" stroke="#334155"/>
  <text x="90" y="225" fill="#f8fafc" font-size="12" font-weight="bold">Ubuntu EC2 Linux Host</text>
  <text x="90" y="250" fill="#38bdf8" font-size="11">Node Exporter (Port 9100)</text>
  <text x="90" y="272" fill="#94a3b8" font-size="10">• CPU utilization &amp; load avg</text>
  <text x="90" y="292" fill="#94a3b8" font-size="10">• Memory buffer / cache leaks</text>
  <text x="90" y="312" fill="#94a3b8" font-size="10">• Disk I/O &amp; read/write throughput</text>
  <text x="90" y="332" fill="#94a3b8" font-size="10">• Network bytes In / Out</text>

  <rect x="75" y="365" width="190" height="150" rx="8" fill="#080a0f" stroke="#334155"/>
  <text x="90" y="395" fill="#f8fafc" font-size="12" font-weight="bold">Docker Container Layer</text>
  <text x="90" y="420" fill="#38bdf8" font-size="11">cAdvisor / App Metrics</text>
  <text x="90" y="442" fill="#94a3b8" font-size="10">• NestJS API response times</text>
  <text x="90" y="462" fill="#94a3b8" font-size="10">• HTTP 5xx error rates</text>
  <text x="90" y="482" fill="#94a3b8" font-size="10">• PostgreSQL query latencies</text>
  <text x="90" y="502" fill="#94a3b8" font-size="10">• Container health status</text>

  <!-- Connect to Prometheus -->
  <path d="M 280 270 L 350 270" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 280 440 L 350 440" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Tier 2: Prometheus Collector -->
  <rect x="355" y="130" width="220" height="425" rx="12" fill="url(#cardBg)" stroke="#f97316" stroke-width="1.5"/>
  <text x="375" y="165" fill="#f97316" font-size="13" font-weight="bold">2. PROMETHEUS CORE</text>

  <rect x="370" y="195" width="190" height="150" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="385" y="225" fill="#f97316" font-size="13" font-weight="bold">Time-Series DB (TSDB)</text>
  <text x="385" y="250" fill="#94a3b8" font-size="11">• Scrape interval: 15s</text>
  <text x="385" y="272" fill="#94a3b8" font-size="11">• Pushgateway support</text>
  <text x="385" y="294" fill="#94a3b8" font-size="11">• PromQL query evaluator</text>
  <text x="385" y="316" fill="#94a3b8" font-size="11">• Service discovery on AWS</text>

  <rect x="370" y="365" width="190" height="150" rx="8" fill="#080a0f" stroke="#ef4444" stroke-width="1.2"/>
  <text x="385" y="395" fill="#ef4444" font-size="13" font-weight="bold">Alert Rules Engine</text>
  <text x="385" y="420" fill="#f8fafc" font-size="11">• Rule: CPU Saturation &gt; 80%</text>
  <text x="385" y="442" fill="#f8fafc" font-size="11">• Rule: Memory &gt; 85% for 5m</text>
  <text x="385" y="464" fill="#f8fafc" font-size="11">• Rule: Disk Free &lt; 15%</text>
  <text x="385" y="486" fill="#f8fafc" font-size="11">• Rule: HTTP 500 Spike</text>

  <!-- Connect to Alertmanager and Grafana -->
  <path d="M 575 270 L 640 270" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)" fill="none"/>
  <path d="M 575 440 L 640 440" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>

  <!-- Tier 3: Alertmanager & AWS SNS -->
  <rect x="645" y="330" width="395" height="225" rx="12" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="665" y="365" fill="#ef4444" font-size="13" font-weight="bold">3. ALERTING &amp; AWS SNS PIPELINE</text>

  <rect x="665" y="385" width="160" height="135" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="680" y="415" fill="#facc15" font-size="12" font-weight="bold">Alertmanager</text>
  <text x="680" y="440" fill="#94a3b8" font-size="11">• Deduplication</text>
  <text x="680" y="462" fill="#94a3b8" font-size="11">• Throttling &amp; Silence</text>
  <text x="680" y="484" fill="#94a3b8" font-size="11">• Pager Grouping</text>

  <!-- Connect to AWS SNS -->
  <path d="M 825 452 L 870 452" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>

  <rect x="875" y="385" width="150" height="135" rx="8" fill="#080a0f" stroke="#ef4444" stroke-width="1.2"/>
  <text x="890" y="415" fill="#ef4444" font-size="12" font-weight="bold">AWS SNS &amp; CW</text>
  <text x="890" y="440" fill="#94a3b8" font-size="11">• SMS Notifications</text>
  <text x="890" y="462" fill="#94a3b8" font-size="11">• Email Incident Alert</text>
  <text x="890" y="484" fill="#94a3b8" font-size="11">• On-Call Engineer</text>

  <!-- Tier 4: Grafana Dashboards -->
  <rect x="645" y="130" width="395" height="185" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="665" y="165" fill="#38bdf8" font-size="13" font-weight="bold">4. GRAFANA DASHBOARDS (PORT 3000)</text>

  <rect x="665" y="185" width="355" height="110" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="685" y="215" fill="#38bdf8" font-size="12" font-weight="bold">Executive Telemetry Dashboards</text>
  <text x="685" y="238" fill="#94a3b8" font-size="11">• Real-Time Gauge: CPU (32%), RAM (4.2GB/8GB), Disk (54%)</text>
  <text x="685" y="258" fill="#94a3b8" font-size="11">• Latency Heatmaps &amp; Traffic Throughput graphs</text>
  <text x="685" y="278" fill="#10b981" font-size="11">• Status: 100% HEALTHY UPTIME (ap-south-1)</text>
</svg>


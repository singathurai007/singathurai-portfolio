<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#090b10; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1040" height="55" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <circle cx="55" cy="52" r="6" fill="#ef4444"/>
  <circle cx="75" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="52" r="6" fill="#10b981"/>
  <text x="125" y="58" fill="#facc15" font-size="16" font-weight="bold">PIPELINE ARCHITECTURE: DevSecOps CI/CD with SonarQube &amp; Trivy on AWS</text>
  <text x="910" y="57" fill="#64748b" font-size="12">GITOPS AUTOMATION</text>

  <!-- Main Container -->
  <rect x="30" y="95" width="1040" height="495" rx="16" fill="#0c0e14" stroke="#1e2638" stroke-width="1.5"/>

  <!-- Stage 1: VCS Source -->
  <rect x="55" y="160" width="150" height="150" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <text x="75" y="195" fill="#facc15" font-size="12" font-weight="bold">SOURCE CODE</text>
  <rect x="70" y="215" width="120" height="70" rx="8" fill="#080a0f" stroke="#334155"/>
  <text x="85" y="245" fill="#f8fafc" font-size="13" font-weight="bold">GitHub</text>
  <text x="85" y="265" fill="#94a3b8" font-size="10">Webhooks Push</text>

  <!-- Arrow Source -> Jenkins -->
  <path d="M 205 235 L 260 235" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Stage 2: Jenkins Orchestrator -->
  <rect x="265" y="130" width="180" height="425" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="285" y="165" fill="#38bdf8" font-size="13" font-weight="bold">CI ORCHESTRATION</text>
  
  <rect x="280" y="190" width="150" height="60" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="295" y="215" fill="#f8fafc" font-size="12" font-weight="bold">1. Checkout</text>
  <text x="295" y="235" fill="#64748b" font-size="10">Git Clone &amp; Env Setup</text>

  <rect x="280" y="265" width="150" height="60" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="295" y="290" fill="#f8fafc" font-size="12" font-weight="bold">2. Security Gate</text>
  <text x="295" y="310" fill="#64748b" font-size="10">Trigger SonarQube</text>

  <rect x="280" y="340" width="150" height="60" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="295" y="365" fill="#f8fafc" font-size="12" font-weight="bold">3. Docker Build</text>
  <text x="295" y="385" fill="#64748b" font-size="10">Multi-Stage Build</text>

  <rect x="280" y="415" width="150" height="60" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="295" y="440" fill="#f8fafc" font-size="12" font-weight="bold">4. Trivy Gate</text>
  <text x="295" y="460" fill="#64748b" font-size="10">Vulnerability Audit</text>

  <rect x="280" y="490" width="150" height="50" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="295" y="515" fill="#f8fafc" font-size="12" font-weight="bold">5. Deploy</text>
  <text x="295" y="530" fill="#64748b" font-size="10">EC2 Release</text>

  <!-- Connect to SonarQube -->
  <path d="M 430 295 L 490 295" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
  <!-- Stage 3: Security Tools (SonarQube & Trivy) -->
  <rect x="495" y="160" width="220" height="360" rx="12" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="515" y="195" fill="#ef4444" font-size="13" font-weight="bold">DEVSECOPS SECURITY GATES</text>

  <rect x="510" y="215" width="190" height="120" rx="8" fill="#080a0f" stroke="#334155"/>
  <text x="525" y="245" fill="#38bdf8" font-size="13" font-weight="bold">SonarQube Server</text>
  <text x="525" y="268" fill="#94a3b8" font-size="11">• Static Code Analysis (SAST)</text>
  <text x="525" y="288" fill="#94a3b8" font-size="11">• Code Smells &amp; Coverage</text>
  <text x="525" y="308" fill="#10b981" font-size="11">• Quality Gate: BLOCK ON FAIL</text>

  <rect x="510" y="355" width="190" height="135" rx="8" fill="#080a0f" stroke="#334155"/>
  <text x="525" y="385" fill="#facc15" font-size="13" font-weight="bold">Trivy Vulnerability Scanner</text>
  <text x="525" y="408" fill="#94a3b8" font-size="11">• Container Image Scan</text>
  <text x="525" y="428" fill="#94a3b8" font-size="11">• CVE Library Database</text>
  <text x="525" y="448" fill="#ef4444" font-size="11">• Fail Severity: HIGH / CRIT</text>
  <text x="525" y="468" fill="#10b981" font-size="11">• Signed &amp; Approved Build</text>

  <!-- Connect to Docker Registry -->
  <path d="M 715 422 L 775 422" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- Stage 4: Registry & Deploy Target -->
  <rect x="780" y="160" width="260" height="360" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
  <text x="800" y="195" fill="#10b981" font-size="13" font-weight="bold">AWS DEPLOYMENT TARGET</text>

  <rect x="795" y="220" width="230" height="85" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="815" y="250" fill="#38bdf8" font-size="12" font-weight="bold">Docker Registry / Hub</text>
  <text x="815" y="272" fill="#94a3b8" font-size="11">Immutable Image Digest</text>
  <text x="815" y="290" fill="#64748b" font-size="10">singathurai007/api:v2.4</text>

  <!-- Flow to AWS EC2 -->
  <path d="M 910 305 L 910 345" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <rect x="795" y="350" width="230" height="145" rx="8" fill="#080a0f" stroke="#facc15" stroke-width="1.5"/>
  <text x="815" y="380" fill="#facc15" font-size="13" font-weight="bold">AWS EC2 Ubuntu Host</text>
  <text x="815" y="402" fill="#94a3b8" font-size="11">• Docker Compose Runtime</text>
  <text x="815" y="422" fill="#94a3b8" font-size="11">• Zero Downtime Rolling Restart</text>
  <text x="815" y="442" fill="#94a3b8" font-size="11">• AWS IAM &amp; Security Groups</text>
  <text x="815" y="465" fill="#10b981" font-size="11">STATUS: LIVE HEALTHY</text>
</svg>


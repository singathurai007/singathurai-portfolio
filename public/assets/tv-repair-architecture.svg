<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#090b10; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1040" height="55" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <circle cx="55" cy="52" r="6" fill="#ef4444"/>
  <circle cx="75" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="52" r="6" fill="#10b981"/>
  <text x="125" y="58" fill="#facc15" font-size="16" font-weight="bold">ARCHITECTURE: TV Repair Lead Management Platform (tvrepaircoimbatore.in)</text>
  <text x="890" y="57" fill="#64748b" font-size="12">PRODUCTION ENVIRONMENT</text>

  <!-- Container Box -->
  <rect x="30" y="95" width="1040" height="495" rx="16" fill="#0c0e14" stroke="#1e2638" stroke-width="1.5"/>

  <!-- Tier 1: Clients & Consumers -->
  <rect x="60" y="130" width="200" height="425" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <text x="85" y="165" fill="#94a3b8" font-size="13" font-weight="bold" letter-spacing="1">1. CLIENT LAYER</text>
  
  <rect x="80" y="195" width="160" height="75" rx="8" fill="#080a0f" stroke="#334155" stroke-width="1"/>
  <text x="95" y="225" fill="#f8fafc" font-size="12" font-weight="bold">Service Seekers</text>
  <text x="95" y="245" fill="#64748b" font-size="11">Lead Ingestion Form</text>

  <rect x="80" y="295" width="160" height="75" rx="8" fill="#080a0f" stroke="#334155" stroke-width="1"/>
  <text x="95" y="325" fill="#f8fafc" font-size="12" font-weight="bold">Shop Owners</text>
  <text x="95" y="345" fill="#64748b" font-size="11">Claim Verified Leads</text>

  <rect x="80" y="395" width="160" height="75" rx="8" fill="#080a0f" stroke="#334155" stroke-width="1"/>
  <text x="95" y="425" fill="#f8fafc" font-size="12" font-weight="bold">Super Admin</text>
  <text x="95" y="445" fill="#64748b" font-size="11">Lead Verification / Sub</text>

  <!-- Flow 1 -> 2 -->
  <path d="M 260 232 L 325 232" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,4"/>
  <path d="M 260 332 L 325 332" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,4"/>
  <path d="M 260 432 L 325 432" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none" stroke-dasharray="4,4"/>

  <!-- Tier 2: API Gateway & Auth -->
  <rect x="330" y="130" width="220" height="425" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="355" y="165" fill="#38bdf8" font-size="13" font-weight="bold" letter-spacing="1">2. NESTJS GATEWAY</text>

  <rect x="350" y="195" width="180" height="70" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="365" y="225" fill="#38bdf8" font-size="12" font-weight="bold">HTTP Controllers</text>
  <text x="365" y="245" fill="#94a3b8" font-size="11">Validation Pipes / DTO</text>

  <rect x="350" y="285" width="180" height="95" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="365" y="315" fill="#facc15" font-size="12" font-weight="bold">Auth & RBAC Guards</text>
  <text x="365" y="335" fill="#94a3b8" font-size="11">• Google OAuth 2.0 SSO</text>
  <text x="365" y="355" fill="#94a3b8" font-size="11">• JWT Token Verification</text>

  <rect x="350" y="400" width="180" height="70" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="365" y="430" fill="#f8fafc" font-size="12" font-weight="bold">Rate Limit & CORS</text>
  <text x="365" y="450" fill="#94a3b8" font-size="11">DDoS / Abuse Shield</text>

  <!-- Flow 2 -> 3 -->
  <path d="M 550 230 L 615 230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none"/>
  <path d="M 550 330 L 615 330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none"/>

  <!-- Tier 3: Business Logic Services -->
  <rect x="620" y="130" width="220" height="425" rx="12" fill="url(#cardBg)" stroke="#272f45" stroke-width="1.5"/>
  <text x="645" y="165" fill="#94a3b8" font-size="13" font-weight="bold" letter-spacing="1">3. SERVICE LAYER</text>

  <rect x="640" y="195" width="180" height="75" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="655" y="225" fill="#f8fafc" font-size="12" font-weight="bold">Lead Dispatcher</text>
  <text x="655" y="245" fill="#94a3b8" font-size="11">Location Proximity Engine</text>

  <rect x="640" y="295" width="180" height="75" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="655" y="325" fill="#f8fafc" font-size="12" font-weight="bold">Subscription Service</text>
  <text x="655" y="345" fill="#94a3b8" font-size="11">Access Tiers & Expiry</text>

  <rect x="640" y="395" width="180" height="75" rx="8" fill="#080a0f" stroke="#1e293b"/>
  <text x="655" y="425" fill="#f8fafc" font-size="12" font-weight="bold">Prisma ORM Client</text>
  <text x="655" y="445" fill="#94a3b8" font-size="11">Connection Pooling</text>

  <!-- Flow 3 -> 4 -->
  <path d="M 840 432 L 905 432" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Tier 4: Database -->
  <rect x="910" y="130" width="130" height="425" rx="12" fill="url(#cardBg)" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="925" y="165" fill="#facc15" font-size="13" font-weight="bold" letter-spacing="1">4. STORAGE</text>

  <ellipse cx="975" cy="240" rx="45" ry="18" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <path d="M 930 240 v 70 a 45 18 0 0 0 90 0 v -70" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <ellipse cx="975" cy="310" rx="45" ry="18" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <text x="945" y="280" fill="#f8fafc" font-size="12" font-weight="bold">PostgreSQL</text>
  <text x="942" y="355" fill="#94a3b8" font-size="11">Lead Store</text>
  <text x="942" y="375" fill="#94a3b8" font-size="11">Shop Roles</text>
  <text x="942" y="395" fill="#94a3b8" font-size="11">Sub Plans</text>
  <text x="942" y="415" fill="#94a3b8" font-size="11">Audit Logs</text>
</svg>

